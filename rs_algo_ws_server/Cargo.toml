[package]
name = "rs_algo_ws_server"
version = "0.1.0"
authors = ["pmagaz <magazpablo@gmail.com>"]
edition = "2024"

[dependencies]
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-channel = "0.3.31"
futures = "0.3.31"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0.98"
thiserror = "2.0"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.40", features = ["serde"] }
dotenv = "0.15.0"
async-trait = "0.1.83"
env_logger = "0.11"
log = "0.4"
mongodb = { version = "2.8", features = ["bson-uuid-0_8"] }
bson = "2.13"
rs_algo_shared = { path = "../../rs_algo_shared", features = ["broker", "websocket"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
strip = true
lto = true
