apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rs-algo-ws-server.fullname" . }}
  labels:
    {{- include "rs-algo-ws-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rs-algo-ws-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rs-algo-ws-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rs-algo-ws-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            {{- toYaml .Values.volumeMounts | default "" | nindent 12 }}
          envFrom:
          - configMapRef:
              name: {{ .Release.Name }}-configmap
          - secretRef:
              name: {{ .Values.envSecretName }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            exec:
              command:
              - ls
            periodSeconds: 90
          readinessProbe:
            exec:
              command:
              - ls
            periodSeconds: 90
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.ibeam.enabled }}
        - name: ibeam
          image: "{{ .Values.ibeam.image }}"
          imagePullPolicy: Always
          env:
            - name: IBEAM_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: BROKER_USERNAME
            - name: IBEAM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: BROKER_PASSWORD
            {{- if .Values.ibeam.totpKey }}
            - name: IBEAM_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: IBKR_TOTP_KEY
            {{- end }}
          ports:
            - containerPort: 5000
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - curl
                - -k
                - -sf
                - https://localhost:5000/v1/api/iserver/auth/status
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.ibeam.resources | nindent 12 }}
        {{- end }}
      {{- with .Values.volumes}}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
